<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
 <div class="game-shell">
        <h1>Memory Game</h1>

        <div class="status-bar">
            <div class="stat">
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>
            <div class="stat">
                <span>Pairs</span>
                <strong id="pairs">0 / 6</strong>
            </div>
        </div>

        <button id="restart-btn" class="restart-btn" type="button">Restart Game</button>
        <div class="game-board" aria-label="Memory game board"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
